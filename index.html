<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so iOS reports safe-area insets via env(); -->
    <!-- maximum-scale stops Safari auto-zoom on focused inputs (the dead -->
    <!-- giveaway of "this is a webview"). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FDF8F7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MyPhonicsBooks" />
    <title>MyPhonicsBooks — Decodable phonics books for children aged 4-8</title>
    <meta name="description" content="Decodable phonics books for children aged 4–8, with interactive reading, sound-by-sound guidance, and stories from around the world. Free reading assessment, UK Letters and Sounds aligned." />
    <meta name="author" content="MyPhonicsBooks" />
    <meta property="og:title" content="MyPhonicsBooks — Decodable phonics books for children aged 4-8" />
    <meta property="og:description" content="Decodable phonics books with interactive reading, free assessment, and stories from around the world. UK Letters and Sounds aligned." />
    <meta property="og:image" content="/logo/mpb-mark.png" />
    <link rel="icon" type="image/png" href="/logo/mpb-mark-transparent.png" />
    <link rel="apple-touch-icon" href="/logo/mpb-mark.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Preload the first row of hero book covers as WebP so they're in
         flight while React boots. Saves ~300ms on first paint. -->
    <link rel="preload" as="image" href="/illustrations/1_1/cover.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/illustrations/2_1/cover.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/illustrations/3_1/cover.webp" type="image/webp" />
    <link rel="preload" as="image" href="/illustrations/4_1/cover.webp" type="image/webp" />

    <!-- Google Analytics (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WR9QE9ZMEN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WR9QE9ZMEN');
    </script>

    <!-- Meta Pixel — window.__META_PIXEL_ID is read by funnel components -->
    <!-- (EmailCapture, useMetaPixel) so they can attribute events to the -->
    <!-- same Pixel without hardcoding the ID twice. -->
    <script>
      window.__META_PIXEL_ID = "1476818270794642";
      if (window.__META_PIXEL_ID) {
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', window.__META_PIXEL_ID);
        fbq('track', 'PageView');
      }
    </script>
    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=1476818270794642&ev=PageView&noscript=1"
    /></noscript>

    <!-- Microsoft Clarity — swap YOUR_CLARITY_PROJECT_ID for the ID from -->
    <!-- clarity.microsoft.com (Settings → Setup). Auto-tracks SPA routes. -->
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "wrmgoeh5fq");
    </script>
  </head>
  <body>
    <!-- Meta Pixel noscript fallback (must live in <body>; HTML5 disallows <img> inside <noscript> in <head>) -->
    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=1476818270794642&ev=PageView&noscript=1"
    /></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

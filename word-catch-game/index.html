<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Word Catch! - A MyPhonicsBooks Game</title>
<style>
  @font-face { font-family: 'Andika'; src: url('./assets/fonts/Andika-Regular.ttf'); font-weight: 400; }
  @font-face { font-family: 'Andika'; src: url('./assets/fonts/Andika-Bold.ttf'); font-weight: 700; }
  :root {
    --pink: #E84B8A; --pink-dark: #C63470; --ink: #58212F;
    --cream: #FFF8EE; --cream-2: #FBEFDD;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--pink-dark); }
  body { font-family: 'Andika', 'Comic Sans MS', system-ui, sans-serif; color: var(--ink);
         touch-action: none; user-select: none; -webkit-user-select: none; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #frame { position: relative; }           /* letterboxed logical 960x540 frame */
  canvas { display: block; border-radius: 12px; }
  .overlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center;
             justify-content: center; text-align: center; border-radius: 12px; }
  .overlay.show { display: flex; }
  .panel { background: var(--cream); border-radius: 24px; padding: 24px 34px;
           box-shadow: 0 12px 40px rgba(88,33,47,.35); max-width: 86%; }
  button { font-family: inherit; font-weight: 700; border: none; cursor: pointer; border-radius: 999px; }
  .btn { background: var(--pink); color: #fff; font-size: 22px; padding: 12px 38px; margin: 8px;
         box-shadow: 0 5px 0 var(--pink-dark); transition: transform .08s; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--pink-dark); }
  .btn.ghost { background: #fff; color: var(--pink); box-shadow: 0 5px 0 #e6d9c4; }
  /* menu */
  #menu { background: linear-gradient(180deg, #EC6AA0, var(--pink) 55%, var(--pink-dark)); }
  #menu img.logo { width: 230px; max-width: 60%; background: var(--cream); padding: 7px 18px;
                   border-radius: 14px; box-shadow: 0 6px 24px rgba(88,33,47,.3); }
  #menu h1 { color: var(--cream); font-size: 50px; letter-spacing: 2px; margin: 8px 0 0;
             text-shadow: 0 4px 0 var(--ink); }
  #menu .sub { color: #FFE4F0; font-size: 19px; margin-bottom: 8px; }
  #menu .hint, #menu .ver { color: #FFC9DFcc; font-size: 12px; margin-top: 6px; }
  #menu .cat { width: 108px; margin-top: 2px; }
  #rotate { display: none; position: fixed; left: 0; right: 0; bottom: 8px; text-align: center;
            color: #FFD9E8; font-size: 13px; z-index: 5; }
  @media (orientation: portrait) { #rotate { display: block; } }
  /* level map */
  #map { background: linear-gradient(180deg, #FDEFF5, var(--cream-2)); justify-content: flex-start;
         padding-top: 18px; }
  #map h2 { color: var(--pink-dark); font-size: 30px; margin-bottom: 10px; }
  #worlds { display: grid; grid-template-columns: repeat(3, 272px); gap: 14px; }
  .world { background: #fff; border-radius: 18px; padding: 10px 12px 12px; border-bottom: 6px solid var(--wc, var(--pink));
           box-shadow: 0 6px 18px rgba(88,33,47,.12); position: relative; }
  .world h3 { font-size: 17px; color: var(--ink); }
  .world .tag { font-size: 12px; color: #fff; background: var(--wc, var(--pink)); display: inline-block;
                border-radius: 999px; padding: 1px 10px; margin-bottom: 2px; }
  .world img { position: absolute; right: 8px; top: 6px; height: 52px; }
  .rounds { display: flex; gap: 6px; margin-top: 8px; }
  .round-btn { flex: 1; background: var(--cream-2); color: var(--ink); font-size: 14px; padding: 7px 0 4px;
               border-radius: 10px; line-height: 1.1; }
  .round-btn .st { display: block; font-size: 11px; letter-spacing: 1px; color: #E8B400; }
  .round-btn:disabled { opacity: .38; cursor: default; }
  .round-btn.next { outline: 3px solid var(--wc, var(--pink)); }
  #lockmsg { min-height: 22px; color: var(--pink-dark); font-size: 15px; margin-top: 8px; }
  /* round end + pause */
  #roundEnd h2 { color: var(--pink-dark); font-size: 40px; }
  #stars { font-size: 58px; letter-spacing: 6px; margin: 6px 0; }
  #starsLabel { font-size: 20px; margin-bottom: 10px; }
  #pause h2 { color: var(--pink-dark); font-size: 44px; margin-bottom: 8px; }
  #pause .ctrl { font-size: 15px; color: #8a6b5a; margin-bottom: 12px; }
  .backBtn { position: absolute; top: 12px; left: 12px; background: #fff; color: var(--pink);
             font-size: 16px; padding: 8px 18px; box-shadow: 0 4px 0 #e6d9c4; }
</style>
</head>
<body>
<div id="stage"><div id="frame">
  <canvas id="c" width="960" height="540"></canvas>

  <div id="menu" class="overlay show">
    <img class="logo" src="./assets/img/logo.png" alt="">
    <h1 id="menuTitle"></h1>
    <div class="sub" id="menuSub"></div>
    <img class="cat" src="./assets/img/cat.png" alt="">
    <button class="btn" id="playBtn"></button>
    <div class="hint" id="menuHint"></div>
    <div class="ver" id="menuVer"></div>
  </div>

  <div id="map" class="overlay">
    <h2 id="mapTitle"></h2>
    <div id="worlds"></div>
    <div id="lockmsg"></div>
    <button class="backBtn" id="mapBack"></button>
  </div>

  <div id="roundEnd" class="overlay">
    <div class="panel">
      <h2 id="roundDoneTitle"></h2>
      <div id="stars"></div>
      <div id="starsLabel"></div>
      <div><button class="btn" id="nextBtn"></button>
      <button class="btn ghost" id="endMapBtn"></button></div>
    </div>
  </div>

  <div id="pause" class="overlay">
    <div class="panel">
      <h2 id="pauseTitle"></h2>
      <div class="ctrl" id="pauseCtrl"></div>
      <div><button class="btn" id="resumeBtn"></button>
      <button class="btn ghost" id="pauseMapBtn"></button></div>
    </div>
  </div>

  <div id="dev" style="position:absolute;top:4px;left:4px;color:#0f0;font:12px monospace;display:none"></div>
</div></div>
<div id="rotate"></div>
<script type="module" src="./game.js"></script>
</body>
</html>

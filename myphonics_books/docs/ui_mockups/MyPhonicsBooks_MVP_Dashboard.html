function StatusBadge({ status }) {
  const styles = {
    complete: 'bg-emerald-100 text-emerald-700 border-emerald-200',
    mostly_done: 'bg-blue-100 text-blue-700 border-blue-200',
    needs_work: 'bg-amber-100 text-amber-700 border-amber-200',
    not_started: 'bg-red-100 text-red-700 border-red-200',
  };
  const labels = {
    complete: 'Complete',
    mostly_done: 'Nearly There',
    needs_work: 'Needs Work',
    not_started: 'Not Started',
  };
  return (
    <span className={`text-xs font-semibold px-2.5 py-1 rounded-full border ${styles[status]}`}>
      {labels[status]}
    </span>
  );
}

function ProgressBar({ pct, colour }) {
  return (
    <div className="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
      <div
        className="h-full rounded-full transition-all duration-700"
        style={{ width: `${pct}%`, backgroundColor: colour || '#6366f1' }}
      />
    </div>
  );
}
